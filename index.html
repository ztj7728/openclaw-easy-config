<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClaw第三方api配置生成器</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f7fb; color: #1f2a37;
    }
    .wrap { max-width: 860px; margin: 40px auto; padding: 0 16px; }
    .card {
      background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
      padding: 24px;
    }
    h1 { font-size: 22px; margin: 0 0 16px; display: flex; align-items: center; gap: 12px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #d9dee7;
      font-size: 14px; outline: none; background: #fff; box-sizing: border-box;
    }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .actions { display: flex; gap: 12px; margin-top: 18px; align-items: center; }
    button {
      border: 0; background: #2563eb; color: #fff; padding: 10px 16px; border-radius: 10px;
      font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .muted { color: #6b7280; font-size: 12px; }
    pre {
      background: #0b1020; color: #e5e7eb; padding: 14px; border-radius: 12px;
      overflow: auto; font-size: 13px; line-height: 1.5; margin-top: 12px;
    }
    .codebox {
      position: relative;
      background: #0b1020; color: #e5e7eb; border-radius: 12px;
      padding: 12px 12px 12px 12px; margin-top: 12px;
    }
    .codebox pre { margin: 0; padding: 0; background: transparent; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      border: 0; background: #111827; color: #e5e7eb; padding: 6px 10px;
      border-radius: 8px; font-size: 12px; cursor: pointer;
    }
    .copy-btn:disabled { opacity: .6; cursor: not-allowed; }
    .field-wrapper { position: relative; }
    .custom-input {
      display: none; margin-top: 8px; width: 100%; box-sizing: border-box;
    }
    .custom-input.show { display: block; }
    .toggle-card {
      margin-top: 18px; padding: 14px 16px; border: 1px solid #d9dee7; border-radius: 12px;
      background: linear-gradient(180deg, #fbfcfe 0%, #f4f7fb 100%);
    }
    .toggle-line {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0;
    }
    .toggle-line span {
      display: block; font-weight: 600;
    }
    .toggle-line input {
      width: 18px; height: 18px; margin: 0; accent-color: #2563eb; flex: 0 0 auto;
    }
    .section-panel {
      display: none; margin-top: 12px; padding: 16px; border: 1px solid #d9dee7;
      border-radius: 12px; background: #fbfcfe;
    }
    .section-panel.show { display: block; }
    .section-panel .toggle-card { margin-top: 0; }
    .section-stack { display: grid; gap: 24px; }
    .model-list { display: grid; gap: 10px; }
    .model-row {
      display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(240px, .9fr) auto; gap: 16px; align-items: center;
    }
    .model-row .field-wrapper { width: 100%; }
    .model-list-head {
      display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(240px, .9fr) auto; gap: 16px;
      margin-bottom: 8px; font-size: 12px; color: #6b7280; font-weight: 600;
      align-items: center;
    }
    .model-capabilities {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 12px; border: 1px solid #d9dee7; border-radius: 12px;
      background: linear-gradient(180deg, #fbfcfe 0%, #f4f7fb 100%);
    }
    .capability-option {
      display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600;
      color: #334155; min-height: 20px; margin: 0;
    }
    .capability-option input {
      width: 16px; height: 16px; margin: 0; accent-color: #2563eb; flex: 0 0 auto;
    }
    .model-actions { display: flex; gap: 8px; margin-top: 8px; }
    .remove-model {
      flex: 0 0 auto;
      min-height: 40px;
      white-space: nowrap;
      align-self: center;
    }
    .ghost-btn {
      border: 1px solid #d1d5db; background: #fff; color: #111827; padding: 8px 12px;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .ghost-btn:disabled { opacity: .6; cursor: not-allowed; }
    input[type="text"] { box-sizing: border-box; }
    #langBtn {
      font-size: 13px; padding: 4px 10px; border-radius: 6px;
      background: #e5e7eb; color: #1f2a37; margin-left: auto; cursor: pointer;
      border: 0; font-weight: 600; white-space: nowrap;
    }
    @media (max-width: 720px) {
      .row { grid-template-columns: 1fr; }
      .model-row, .model-list-head { grid-template-columns: 1fr; }
      .remove-model { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>
        <span data-i18n="title">OpenClaw第三方api配置生成器</span>
        <button id="langBtn">EN</button>
      </h1>
      <div class="row">
        <div>
          <label for="baseurl" data-i18n="label_baseurl">Base URL</label>
          <div class="field-wrapper">
            <select id="baseurl">
              <!-- Options will be dynamically generated -->
            </select>
            <input type="text" id="baseurl_custom" class="custom-input" data-i18n-placeholder="placeholder_baseurl" placeholder="输入自定义 Base URL" />
          </div>
        </div>
        <div>
          <label for="provider" data-i18n="label_provider">提供商（快捷选择）</label>
          <div class="field-wrapper">
            <select id="provider">
              <!-- Options will be dynamically generated -->
            </select>
            <input type="text" id="provider_custom" class="custom-input" data-i18n-placeholder="placeholder_provider" placeholder="输入自定义提供商" />
          </div>
        </div>
      </div>

      <label for="model_id" data-i18n="label_model_id">模型配置</label>
      <div class="model-list-head">
        <span data-i18n="label_model_name">模型 ID</span>
        <span data-i18n="label_model_apimode">API模式</span>
        <span data-i18n="label_model_capabilities">能力选项</span>
        <span aria-hidden="true"></span>
      </div>
      <div class="model-list" id="modelList"></div>
      <div class="model-actions">
        <button type="button" id="addModelBtn" class="ghost-btn" data-i18n="btn_add_model">添加模型</button>
      </div>

      <label for="apikey" data-i18n="label_apikey">API Key</label>
      <input id="apikey" data-i18n-placeholder="placeholder_apikey" placeholder="请输入 apikey，请至第三方API站中的令牌管理处获取" />

      <div class="toggle-card">
        <label class="toggle-line" for="memorySearchEnabled">
          <span data-i18n="label_memorysearch_enable">启用 memorySearch 向量记忆检索</span>
          <input type="checkbox" id="memorySearchEnabled" />
        </label>
        <div class="muted" data-i18n="memorysearch_hint">默认关闭。开启后可配置向量检索模型与远端嵌入服务。</div>
      </div>

      <div id="memorySearchPanel" class="section-panel">
        <div class="section-stack">
          <div class="row">
            <div>
              <label for="memorysearch_provider" data-i18n="label_memorysearch_provider">MemorySearch Provider</label>
              <div class="field-wrapper">
                <select id="memorysearch_provider">
                  <!-- Options will be dynamically generated -->
                </select>
                <input type="text" id="memorysearch_provider_custom" class="custom-input" data-i18n-placeholder="placeholder_memorysearch_provider" placeholder="输入自定义 memorySearch provider" />
              </div>
            </div>
            <div>
              <label for="memorysearch_model" data-i18n="label_memorysearch_model">Embedding Model</label>
              <div class="field-wrapper">
                <select id="memorysearch_model">
                  <!-- Options will be dynamically generated -->
                </select>
                <input type="text" id="memorysearch_model_custom" class="custom-input" data-i18n-placeholder="placeholder_memorysearch_model" placeholder="输入自定义 embedding model" />
              </div>
            </div>
          </div>

          <div class="toggle-card">
            <label class="toggle-line" for="memorysearch_use_chat_remote">
              <span data-i18n="label_memorysearch_use_chat_remote">复用主聊天配置的 Base URL 与 API Key</span>
              <input type="checkbox" id="memorysearch_use_chat_remote" checked />
            </label>
            <div class="muted" data-i18n="memorysearch_remote_hint">勾选后会直接使用上方聊天模型配置里的 Base URL 与 API Key。</div>
          </div>

          <div id="memorySearchRemotePanel" class="section-panel">
            <div class="row">
              <div>
                <label for="memorysearch_remote_baseurl" data-i18n="label_memorysearch_remote_baseurl">MemorySearch Base URL</label>
                <div class="field-wrapper">
                  <select id="memorysearch_remote_baseurl">
                    <!-- Options will be dynamically generated -->
                  </select>
                  <input type="text" id="memorysearch_remote_baseurl_custom" class="custom-input" data-i18n-placeholder="placeholder_memorysearch_remote_baseurl" placeholder="输入自定义 memorySearch Base URL" />
                </div>
              </div>
              <div>
                <label for="memorysearch_remote_provider" data-i18n="label_memorysearch_remote_provider">MemorySearch Remote Provider</label>
                <div class="field-wrapper">
                  <select id="memorysearch_remote_provider">
                    <!-- Options will be dynamically generated -->
                  </select>
                  <input type="text" id="memorysearch_remote_provider_custom" class="custom-input" data-i18n-placeholder="placeholder_memorysearch_remote_provider" placeholder="输入自定义远端提供商" />
                </div>
              </div>
            </div>

            <label for="memorysearch_apikey" data-i18n="label_memorysearch_apikey">MemorySearch API Key</label>
            <input id="memorysearch_apikey" data-i18n-placeholder="placeholder_memorysearch_apikey" placeholder="请输入 memorySearch API Key" />
          </div>
        </div>
        </div>
      </div>

      <label for="config" data-i18n="label_config">Config (JSON/JSON5/String)</label>
      <textarea id="config" data-i18n-placeholder="placeholder_config" placeholder="粘贴您的~/.openclaw/openclaw.json内容，或在您的openclaw的web控制台中的setting下的config选项卡中，切换为Raw模式找到"></textarea>
      <div class="muted" data-i18n="config_hint">支持 JSON5 语法，例如注释、尾随逗号和单引号字符串。</div>

      <div class="actions">
        <button id="sendBtn" data-i18n="btn_send">发送</button>
        <span class="muted" id="status" data-i18n="status_ready">就绪</span>
      </div>

      <div class="codebox">
        <button id="copyBtn" class="copy-btn" data-i18n="btn_copy">复制</button>
        <pre><code id="output" data-i18n="output_placeholder">响应将显示在这里</code></pre>
      </div>
    </div>
  </div>

  <script src="lang.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/json5@2/dist/index.min.js"></script>
  <script src="script.js"></script>
  <script>
    setLang(currentLang);
    document.getElementById("langBtn").addEventListener("click", () => {
      setLang(currentLang === "zh" ? "en" : "zh");
    });
  </script>
</body>
</html>
